<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result - ConcreteReg</title>

<link rel="stylesheet" href="../static/result.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>ConcreteReg</h1>
            </div>
            <div class="nav-links">

                <a href="/contact">Contact</a>
                <a href="/documentaion">Documentation</a>

                    <h2>Predicted Concrete Strength</h2>

            </div>
        </div>

        <!-- Footer -->
